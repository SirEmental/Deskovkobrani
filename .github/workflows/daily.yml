name: Denní kontrola slev

on:
  schedule:
    # 7:30 ráno českého času (v UTC je to 5:30 v létě / 6:30 v zimě -
    # necháváme 6:30 UTC jako rozumný kompromis, uprav podle chuti)
    - cron: "30 6 * * *"
  workflow_dispatch: {}  # umožní ruční spuštění tlačítkem "Run workflow"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v5

      - name: Nastavit Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalovat závislosti
        run: pip install -r requirements.txt

      - name: Spustit scraper
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          MIN_DISCOUNT_PCT: ${{ vars.MIN_DISCOUNT_PCT }}
        run: python -m scraper.main

      - name: Uložit změny (galerie + historie) zpět do repozitáře
        run: |
          git config user.name "boardgame-deals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html data/seen.json
          git diff --staged --quiet || git commit -m "Denní aktualizace slev [skip ci]"
          git push
